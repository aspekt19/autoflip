name: SERV evaluation evidence

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: serv-evaluation-evidence
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require SERV credentials
        env:
          SERV_API_KEY: ${{ secrets.SERV_API_KEY }}
        run: |
          if [ -z "$SERV_API_KEY" ]; then
            echo "::error::Repository secret SERV_API_KEY is missing. Add it in Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run baseline-versus-SERV evaluation
        env:
          SERV_API_KEY: ${{ secrets.SERV_API_KEY }}
          SERV_BASE_URL: ${{ secrets.SERV_BASE_URL }}
        run: npm run eval:serv

      - name: Upload raw evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoflip-serv-evaluation-${{ github.run_number }}
          path: |
            eval/results/latest.json
            eval/results/latest.md
          if-no-files-found: error
          retention-days: 90

      - name: Open a reviewable PR with measured results
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          branch="evidence/serv-eval-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add eval/results/latest.json eval/results/latest.md
          git commit -m "Evidence: publish measured SERV evaluation"
          git push origin "$branch"
          cat > /tmp/pr-body.md <<'EOF'
          ## What this publishes
          - The measured baseline-versus-SERV evaluation generated by `npm run eval:serv`.
          - The complete machine-readable rows and a human-readable summary.

          ## Review requirements
          - Inspect regressions as well as improvements.
          - Do not describe SERV as better overall unless the measured rows support that claim.
          - Synthetic adversarial cases are labeled in the result file.
          - The workflow does not deploy the application.
          EOF
          gh pr create --base main --head "$branch" --title "Evidence: publish measured SERV evaluation" --body-file /tmp/pr-body.md
