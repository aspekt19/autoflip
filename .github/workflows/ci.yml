name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Playwright Chromium install is not supported on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    # Fail the job if a step hangs (Playwright matrix + next-check loops).
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency tree (strict)
        run: |
          echo "::group::npm ls --omit=dev (deployable tree)"
          # npm ls exits non-zero for unmet optionals/extraneous; listing is informational.
          npm ls --omit=dev --all || true
          echo "::endgroup::"
          echo "::group::Assert experimental SDK absent from production deps"
          for pkg in @openserv-labs/sdk openai; do
            if npm ls --omit=dev "$pkg" >/dev/null 2>&1; then
              echo "ERROR: $pkg is present in the production dependency tree"
              npm ls --omit=dev "$pkg"
              exit 1
            fi
            echo "OK: $pkg not in production tree"
          done
          # zod is still forbidden as a direct production dependency. The pinned
          # x402 protocol packages use it internally; allow only those transitive
          # paths, and fail closed if any unrelated runtime dependency pulls it in.
          npm ls --omit=dev --all --json > .production-dependency-tree.json
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (Object.hasOwn(manifest.dependencies ?? {}, "zod")) {
            throw new Error("zod must not be a direct production dependency");
          }
          const allowed = new Set(["@x402/core", "@x402/evm", "@x402/extensions"]);
          const tree = JSON.parse(fs.readFileSync(".production-dependency-tree.json", "utf8"));
          const violations = [];
          function walk(dependencies, ancestors = []) {
            for (const [name, node] of Object.entries(dependencies ?? {})) {
              const next = [...ancestors, name];
              if (name === "zod" && !ancestors.some((parent) => allowed.has(parent))) {
                violations.push(next.join(" -> "));
              }
              walk(node.dependencies, next);
            }
          }
          walk(tree.dependencies);
          fs.unlinkSync(".production-dependency-tree.json");
          if (violations.length) {
            throw new Error("Unexpected production zod dependency path(s): " + violations.join("; "));
          }
          for (const name of allowed) {
            if (manifest.dependencies?.[name] !== "2.31.0") {
              throw new Error(name + " must remain pinned to the audited 2.31.0 release");
            }
          }
          console.log("OK: zod is transitive only beneath pinned @x402 packages; no direct zod dependency");
          NODE
          echo "::endgroup::"
          npm audit --omit=dev --audit-level=high
      - name: Report full dependency audit (incl. dev / experimental SDK — informational)
        run: |
          echo "Full-tree audit (includes devDependencies such as experimental @openserv-labs/sdk)."
          echo "This step does NOT gate merge; production gate is audit --omit=dev above."
          npm audit --json > npm-audit-full.json || true
          node -e 'const a=require("./npm-audit-full.json"); const t=a.metadata?.vulnerabilities??{}; console.log("Full-tree vulnerability totals:", JSON.stringify(t)); for (const [name,v] of Object.entries(a.vulnerabilities??{})) { const via=(v.via||[]).map(x=>typeof x==="string"?x:`${x.title} [${x.url}]`).join("; "); console.log(`${name}: ${v.severity}; direct=${v.isDirect}; range=${v.range}; ${via}`); }'
          npm audit || true
      - name: Check types
        run: npm run typecheck
      - name: Production source import boundary (fail-closed, Node)
        run: node scripts/assert-openserv-source-boundary.mjs
      - name: Run unit tests
        run: npm test
      - name: Golden query replay
        run: npm run golden
      - name: Find/Radar SERV acceptance (merge gate)
        run: npm run test:acceptance:find-radar-serv
      - name: Find/Radar HTTP e2e (stub upstreams)
        run: npm run test:e2e:find-radar-http
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright check e2e
        run: npm run test:e2e
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: test-results/responsive-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Production build
        run: npm run build
      - name: Assert .next/server does not embed OpenServ SDK (fail-closed, Node)
        run: node scripts/assert-no-openserv-in-next-server.mjs
