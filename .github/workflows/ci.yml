name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency tree
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const a = require("./npm-audit.json");
          // Known high-only tree under direct @openserv-labs/sdk@2.4.1 (zod GHSA-mrhx-c7xc-m3w5).
          // No patched SDK release; Scout SDK path is default-OFF and not the HTTP primary site.
          // Any NEW high/critical outside this allowlist still fails closed.
          const OPENSERV_SDK_HIGH_ALLOW = new Set([
            "@openserv-labs/sdk",
            "@asteasolutions/zod-to-openapi",
            "@n8n/json-schema-to-zod",
            "openai",
            "zod",
          ]);
          const highs = [];
          for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) {
            const via = (v.via || [])
              .map((x) => (typeof x === "string" ? x : `${x.title} [${x.url}]`))
              .join("; ");
            console.log(
              `${name}: ${v.severity}; direct=${v.isDirect}; range=${v.range}; fix=${JSON.stringify(v.fixAvailable)}; ${via}`,
            );
            if (v.severity === "critical") {
              console.error(`CRITICAL vulnerability not allowed: ${name}`);
              process.exit(1);
            }
            if (v.severity === "high") highs.push(name);
          }
          const totals = a.metadata?.vulnerabilities ?? {};
          console.log("Totals:", JSON.stringify(totals));
          const unexpected = highs.filter((n) => !OPENSERV_SDK_HIGH_ALLOW.has(n));
          if (unexpected.length) {
            console.error("Unexpected high vulnerabilities:", unexpected.join(", "));
            process.exit(1);
          }
          if ((totals.critical ?? 0) > 0) process.exit(1);
          if (highs.length) {
            console.log(
              `Allowing ${highs.length} known @openserv-labs/sdk-tree high(s) until upstream ships a fix: ${highs.join(", ")}`,
            );
          }
          NODE
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Production build
        run: npm run build
