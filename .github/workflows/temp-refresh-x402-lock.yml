name: Refresh x402 dependency lockfile

on:
  push:
    branches:
      - feat/clear-serv-chat-pending-state-2026-11-13

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/clear-serv-chat-pending-state-2026-11-13
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh x402 dependency lockfile"
            git push origin HEAD:feat/clear-serv-chat-pending-state-2026-11-13
          fi
