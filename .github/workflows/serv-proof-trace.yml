name: SERV redacted proof trace

on:
  workflow_run:
    workflows: ["SERV evaluation evidence"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: serv-redacted-proof-trace
  cancel-in-progress: false

jobs:
  trace:
    if: github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'push') && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require SERV credentials
        env:
          SERV_API_KEY: ${{ secrets.SERV_API_KEY }}
        run: |
          if [ -z "$SERV_API_KEY" ]; then
            echo "::error::Repository secret SERV_API_KEY is missing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run one real SERV inference and write a redacted trace
        env:
          SERV_API_KEY: ${{ secrets.SERV_API_KEY }}
          SERV_BASE_URL: ${{ secrets.SERV_BASE_URL }}
        run: npm run eval:trace

      - name: Upload redacted trace artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoflip-serv-proof-trace-${{ github.event.workflow_run.id }}
          path: |
            eval/results/serv-proof-trace.json
            eval/results/serv-proof-trace.md
          if-no-files-found: error
          retention-days: 90

      - name: Refresh fixed evidence/serv-proof-trace-latest branch
        run: |
          branch="evidence/serv-proof-trace-latest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add eval/results/serv-proof-trace.json eval/results/serv-proof-trace.md
          if git diff --cached --quiet; then
            echo "No proof-trace file changes to publish."
          else
            git commit -m "Evidence: refresh redacted SERV proof trace"
            git push --force-with-lease origin "$branch"
          fi
          echo "## Redacted SERV proof trace" >> "$GITHUB_STEP_SUMMARY"
          echo "Trace artifact was force-updated on fixed branch: \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Unique per-run proof-trace branches are no longer created." >> "$GITHUB_STEP_SUMMARY"
          echo "This trace omits raw prompts, VINs, facts, and free-form model output." >> "$GITHUB_STEP_SUMMARY"
