# Live eval (4 queries: 2 Find + 2 Resale) + optional Check-by-link / Check-by-VIN.
#
# Auth / URL (values are never printed):
#   Bearer token = secrets.CRON_SECRET, or secrets.RADAR_CRON_SECRET if the
#   former is unset. POST /api/internal/eval-live accepts either, same as Radar.
#   Origin = secrets.EVAL_LIVE_URL, or https://autoflip-umber.vercel.app if
#   unset (no trailing slash). The workflow POSTs
#   ${origin}/api/internal/eval-live.
#
# Optional:
#   EVAL_LIVE_SEED  — Numeric seed for reproducible notes (default: run id hash).
#   listingUrl / vin — Check-by-link and Check-by-VIN (same auth; no new secrets,
#   no user quota, no payments). Blocked link fetch is reported as blocked.
#
# Stepping: action=start then action=step repeatedly. Each step is one chat
# turn (send / ask-reply / brief-confirm / continue) — never a full query —
# matching /api/find/chat and /api/resale/chat under Hobby 300s.
#
# The workflow fails with a clear message if neither CRON_SECRET nor
# RADAR_CRON_SECRET is set. It never echoes secret values.
name: Live eval (4 queries)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Optional numeric seed (blank = derive from run id)"
        required: false
        type: string
      max_queries:
        description: "Max queries (0 = Find vs Gemini T0/T+10; 1–4 = regular Find/Resale batch)"
        required: false
        default: "4"
        type: string
      listingUrl:
        description: "Optional Check-by-link listing URL (same eval auth; no quota)"
        required: false
        type: string
      vin:
        description: "Optional Check-by-VIN (17-char; same eval auth; no quota)"
        required: false
        type: string
      notes:
        description: 'Optional JSON array of shopper notes, e.g. [{"product":"find","note":"...","zip":"80202"}]'
        required: false
        type: string
      serv_verdict_features:
        description: 'Find verdict features: on (default, Kronos/Multipath/Shadow) or off (bare model)'
        required: false
        default: "on"
        type: string

permissions:
  contents: read

concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  live-eval:
    if: ${{ github.event.inputs.max_queries != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.RADAR_CRON_SECRET }}
          EVAL_LIVE_URL: ${{ secrets.EVAL_LIVE_URL || 'https://autoflip-umber.vercel.app' }}
        run: |
          missing=0
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Repository secret CRON_SECRET or RADAR_CRON_SECRET is missing. Add one under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${EVAL_LIVE_URL}" ]; then
            echo "::error::EVAL_LIVE_URL is empty and the default production origin was not applied."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stepped live eval against production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.RADAR_CRON_SECRET }}
          EVAL_LIVE_URL: ${{ secrets.EVAL_LIVE_URL || 'https://autoflip-umber.vercel.app' }}
          INPUT_SEED: ${{ github.event.inputs.seed }}
          INPUT_MAX_QUERIES: ${{ github.event.inputs.max_queries }}
          INPUT_LISTING_URL: ${{ github.event.inputs.listingUrl }}
          INPUT_VIN: ${{ github.event.inputs.vin }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          INPUT_SERV_VERDICT_FEATURES: ${{ github.event.inputs.serv_verdict_features }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p eval/results/live
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const origin = String(process.env.EVAL_LIVE_URL || "").replace(/\/$/, "");
          const secret = String(process.env.CRON_SECRET || "");
          if (!origin) {
            console.error("EVAL_LIVE_URL is empty.");
            process.exit(1);
          }
          if (!secret) {
            console.error("CRON_SECRET is empty.");
            process.exit(1);
          }

          const parsedMax = Number(process.env.INPUT_MAX_QUERIES || "4");
          const maxQueries = Number.isFinite(parsedMax)
            ? Math.max(0, Math.min(4, parsedMax))
            : 4;
          const seedInput = String(process.env.INPUT_SEED || "").trim();
          const seed = /^\d+$/.test(seedInput)
            ? Number(seedInput)
            : Number(
                BigInt("0x" + crypto.createHash("sha256").update(String(process.env.GITHUB_RUN_ID || "0")).digest("hex").slice(0, 12)) %
                  1_000_000_000n,
              );
          const listingUrl = String(process.env.INPUT_LISTING_URL || "").trim();
          const vin = String(process.env.INPUT_VIN || "").trim().toUpperCase();
          const notesRaw = String(process.env.INPUT_NOTES || "").trim();
          let notes;
          if (notesRaw) {
            try {
              notes = JSON.parse(notesRaw);
            } catch {
              throw new Error("INPUT_NOTES must be a JSON array of notes or {product,note,zip} objects");
            }
          }
          const servVerdictFeatures =
            String(process.env.INPUT_SERV_VERDICT_FEATURES || "on").trim().toLowerCase() === "off"
              ? "off"
              : "on";

          const url = `${origin}/api/internal/eval-live`;
          const headers = {
            "content-type": "application/json",
            authorization: `Bearer ${secret}`,
          };

          async function post(body) {
            const res = await fetch(url, {
              method: "POST",
              headers,
              body: JSON.stringify(body),
            });
            const text = await res.text();
            let json;
            try {
              json = JSON.parse(text);
            } catch {
              json = { error: "invalid_json", message: text.slice(0, 200) };
            }
            if (!res.ok) {
              const err = json && json.error ? String(json.error) : `http_${res.status}`;
              const msg = json && json.message ? String(json.message) : res.statusText;
              throw new Error(`${err}: ${msg}`);
            }
            return json;
          }

          (async () => {
            // Per-query chat hop ceiling matches eval/live/drive-chat.ts.
            const maxHopsPerQuery = 40;
            const maxHops = maxQueries * maxHopsPerQuery + 4;
            console.log(`live-eval start seed=${seed} maxQueries=${maxQueries} notes=${notes ? notes.length : 0} servVerdictFeatures=${servVerdictFeatures} url=${url}`);
            let report;
            if (maxQueries === 0) {
              if (!listingUrl && !vin) {
                throw new Error("max_queries=0 requires listingUrl and/or vin (checks only)");
              }
              report = { ok: true, done: true, results: [], seed, maxQueries, mode: "live" };
              console.log("checks-only: skipping Find/Resale queries");
            } else {
              report = await post({ action: "start", seed, maxQueries, notes, servVerdictFeatures });
              const batchId = report.batchId;
              if (!batchId) throw new Error("start did not return batchId");
              let hops = 0;
              while (!report.done && hops < maxHops) {
                hops += 1;
                report = await post({ action: "step", batchId });
                const hopStatus = report.hopStatus || report.lastHop?.status || "—";
                const queryId = report.queryId || "—";
                const product = report.product || "—";
                console.log(
                  `hop=${hops} query=${queryId} product=${product} status=${hopStatus} session=${report.sessionId || "—"} asked=${report.asked ?? false} brief=${report.briefConfirmed ?? false}`,
                );
                const last = report.lastResult;
                if (last) {
                  console.log(
                    `[${last.id}] product=${last.product} ok=${last.ok} mode=${last.agentMode ?? "—"} rounds=${last.toolRounds ?? 0} verdictReached=${last.verdictReached ?? false} durationMs=${last.durationMs ?? last.elapsedMs ?? 0}`,
                  );
                }
              }
              if (!report.done) {
                throw new Error(`live-eval hit hop ceiling (${maxHops}) before batch done`);
              }
            }

            const checks = [];
            if (listingUrl) {
              console.log(`check-by-link url=${listingUrl.slice(0, 80)}`);
              const linkCheck = await post({ action: "check", kind: "link", listingUrl });
              const row = linkCheck.check || linkCheck;
              checks.push(row);
              console.log(
                `check-by-link ok=${row.ok} blocked=${row.blocked ?? false} error=${row.error || "—"} elapsedMs=${row.elapsedMs ?? 0}`,
              );
            }
            if (vin) {
              console.log(`check-by-vin vin=${vin}`);
              const vinCheck = await post({ action: "check", kind: "vin", vin });
              const row = vinCheck.check || vinCheck;
              checks.push(row);
              console.log(
                `check-by-vin ok=${row.ok} blocked=${row.blocked ?? false} error=${row.error || "—"} elapsedMs=${row.elapsedMs ?? 0}`,
              );
            }
            if (checks.length) {
              report.checks = checks;
            }

            const outPath = `eval/results/live/gha-${seed}-report.json`;
            fs.writeFileSync(outPath, `${JSON.stringify(report, null, 2)}\n`);
            console.log(`Wrote ${outPath} results=${(report.results || []).length} checks=${checks.length} done=${report.done}`);
            const failed = (report.results || []).filter((r) => !r.ok);
            // Blocked Check-by-link is reported, not a workflow failure.
            const checkFailed = checks.filter((c) => !c.ok && !c.blocked);
            if (failed.length || checkFailed.length) {
              console.error(
                `live-eval finished with ${failed.length} failing quer(y/ies) and ${checkFailed.length} failing check(s).`,
              );
              process.exit(1);
            }
          })().catch((err) => {
            console.error(String(err && err.message ? err.message : err));
            process.exit(1);
          });
          NODE

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-report
          path: eval/results/live/*-report.json
          if-no-files-found: warn
          retention-days: 30


  # Manual head-to-head mode: set max_queries=0 in the dispatch form.
  # It runs Find locally through runFindChatTurn and Gemini; it does not run Resale,
  # does not use production KV, and never charges Lemonless report credits.
  find-gemini-head-to-head:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_queries == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Require comparison secrets
        env:
          SERV_API_KEY: ${{ secrets.SERV_API_KEY }}
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          if [ -z "${SERV_API_KEY}" ]; then
            echo "::error::Repository secret SERV_API_KEY is missing."
            missing=1
          fi
          if [ -z "${AUTODEV_API_KEY}" ]; then
            echo "::error::Repository secret AUTODEV_API_KEY is missing."
            missing=1
          fi
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is missing."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run two-round Find vs Gemini comparison
        env:
          SERV_API_KEY: ${{ secrets.SERV_API_KEY }}
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
          SERV_BASE_URL: ${{ secrets.SERV_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          OUTPUT_DIR: eval/results/find-gemini-head-to-head-2026-11-13
        run: npx tsx eval/comparison/find-gemini-head-to-head.mjs

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: find-gemini-head-to-head-2026-11-13
          path: eval/results/find-gemini-head-to-head-2026-11-13/
          if-no-files-found: warn
          retention-days: 30
