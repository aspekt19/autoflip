name: Reppo evaluation experiment

# Manual only. Push must never submit. Live submit requires an explicit typed confirmation
# because the previously configured endpoint returned HTML 404.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status = fetch a prior receipt; submit = live Reppo API (blocked unless confirmed)"
        required: true
        type: choice
        options:
          - status
          - submit
        default: status
      reppo_run_id:
        description: "GitHub Actions run ID from an earlier Reppo receipt (status mode)"
        required: false
        type: string
      confirm_live_submit:
        description: "Type SUBMIT_LIVE_REPPO to allow mode=submit. Leave empty for status."
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: reppo-evaluation-experiment
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Restrict execution to the Reppo experiment branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/experiment/reppo-evaluation-poc" ]; then
            echo "::error::Run this workflow only from experiment/reppo-evaluation-poc."
            exit 1
          fi

      - name: Block accidental live submit
        if: inputs.mode == 'submit'
        run: |
          if [ "${{ inputs.confirm_live_submit }}" != "SUBMIT_LIVE_REPPO" ]; then
            echo "::error::Live Reppo submit is disabled. Re-run with mode=status, or set confirm_live_submit=SUBMIT_LIVE_REPPO only after the endpoint is confirmed. Do not invent endpoints."
            exit 1
          fi
          echo "::warning::Live submit confirmation accepted. This still requires a working Reppo API; do not invent endpoints."

      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/reppo-evaluation-poc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Reppo API key
        env:
          REPPO_API_KEY: ${{ secrets.REPPO_API_KEY }}
        run: |
          if [ -z "$REPPO_API_KEY" ]; then
            echo "::error::Repository secret REPPO_API_KEY is missing."
            exit 1
          fi

      - name: Download SERV evaluation evidence
        if: inputs.mode == 'submit' && inputs.confirm_live_submit == 'SUBMIT_LIVE_REPPO'
        uses: actions/download-artifact@v4
        with:
          name: autoflip-serv-evaluation-5
          path: eval/results
          repository: ${{ github.repository }}
          run-id: 42195292149
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit baseline and SERV evaluations to Reppo
        if: inputs.mode == 'submit' && inputs.confirm_live_submit == 'SUBMIT_LIVE_REPPO'
        env:
          REPPO_API_KEY: ${{ secrets.REPPO_API_KEY }}
          REPPO_ALLOW_LIVE_SUBMIT: SUBMIT_LIVE_REPPO
        run: npm run eval:reppo

      - name: Wait for Reppo's 10-minute settlement window
        if: inputs.mode == 'submit' && inputs.confirm_live_submit == 'SUBMIT_LIVE_REPPO'
        run: sleep 620

      - name: Fetch Reppo evaluation results after submit
        if: inputs.mode == 'submit' && inputs.confirm_live_submit == 'SUBMIT_LIVE_REPPO'
        env:
          REPPO_API_KEY: ${{ secrets.REPPO_API_KEY }}
        run: npm run eval:reppo:status

      - name: Download previous Reppo receipt
        if: inputs.mode == 'status'
        uses: actions/download-artifact@v4
        with:
          name: autoflip-reppo-receipt
          path: eval/results
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reppo_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch settled Reppo evaluations
        if: inputs.mode == 'status'
        env:
          REPPO_API_KEY: ${{ secrets.REPPO_API_KEY }}
        run: npm run eval:reppo:status

      - name: Upload Reppo receipt
        if: inputs.mode == 'submit' && inputs.confirm_live_submit == 'SUBMIT_LIVE_REPPO'
        uses: actions/upload-artifact@v4
        with:
          name: autoflip-reppo-receipt
          path: eval/results/reppo-latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Write run summary
        run: |
          echo "## Reppo experiment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ inputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: experiment/reppo-evaluation-poc" >> "$GITHUB_STEP_SUMMARY"
          echo "- Push trigger removed; workflow_dispatch only." >> "$GITHUB_STEP_SUMMARY"
          echo "- Live submit requires confirm_live_submit=SUBMIT_LIVE_REPPO." >> "$GITHUB_STEP_SUMMARY"
          echo "- No customer reports are submitted; this is an offline fixture-based experiment." >> "$GITHUB_STEP_SUMMARY"
