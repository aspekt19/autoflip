<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Lemonless">
  <!--
    Animation note: CSS transform on an element REPLACES the SVG transform attribute.
    Keep positioning on an outer <g>; animate only an inner #lemon so the fruit stays
    centered in the lens at first paint, during motion, and after settle.
    Lemon opacity stays 1 for the whole timeline (no invisible phases).
  -->
  <style>
    @keyframes drawRing {
      from { stroke-dashoffset: 110.58; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes focusLemon {
      0% { transform: scale(0.9); filter: blur(1.1px); }
      55% { transform: scale(1.05); filter: blur(0); }
      100% { transform: scale(1); filter: blur(0); }
    }
    @keyframes settleHandle {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeGlint {
      from { opacity: 0; }
      to { opacity: 0.55; }
    }
    #lens-ring {
      stroke-dasharray: 110.58;
      stroke-dashoffset: 110.58;
      animation: drawRing 0.75s cubic-bezier(.2,.7,.2,1) forwards;
    }
    #lemon {
      transform-origin: 0px 0px;
      transform-box: fill-box;
      animation: focusLemon 0.55s 0.28s cubic-bezier(.2,.8,.2,1) both;
    }
    #handle-group {
      animation: settleHandle 0.35s 0.65s ease-out both;
    }
    #glint {
      animation: fadeGlint 0.4s 0.9s ease-out both;
    }
    @media (prefers-reduced-motion: reduce) {
      #lens-ring {
        animation: none !important;
        stroke-dashoffset: 0;
      }
      #lemon {
        animation: none !important;
        filter: none;
        transform: none;
      }
      #handle-group, #glint {
        animation: none !important;
        opacity: 1;
      }
      #glint { opacity: 0.55; }
    }
  </style>
  <defs>
    <radialGradient id="lemonGrad" cx="35%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FFE45C"/>
      <stop offset="45%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#F2B705"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F4FF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#E8F4FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="40%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#e02020"/>
    </linearGradient>
    <linearGradient id="handleGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f04a4a"/>
      <stop offset="40%" stop-color="#db0404"/>
      <stop offset="100%" stop-color="#b80e0e"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="26.5" cy="26.0" r="14.9"/>
    </clipPath>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="#0c0c0c"/>
  <circle cx="26.5" cy="26.0" r="14.9" fill="url(#glassGrad)"/>
  <g clip-path="url(#lensClip)">
    <g transform="translate(26.5 26.0) rotate(-20) scale(0.82)">
      <g id="lemon">
        <path d="M -22.4 0.0 C -21.8 -1.6 -21.0 -3.8 -19.2 -6.2 C -16.4 -10.2 -12.0 -12.8 -6.8 -13.6 C -2.0 -14.2 3.2 -13.6 7.8 -11.8 C 12.8 -9.8 16.8 -6.6 19.4 -3.0 C 20.8 -1.2 21.6 -0.2 22.0 0.4 C 22.4 1.0 22.2 1.8 21.4 2.6 C 19.2 6.2 15.4 10.0 10.4 12.2 C 5.6 14.2 0.2 14.4 -4.8 13.0 C -10.2 11.4 -15.0 8.0 -18.4 3.8 C -20.0 1.8 -21.4 0.6 -22.4 0.0 Z" fill="url(#lemonGrad)"/>
        <ellipse cx="-5.0" cy="-4.8" rx="9.0" ry="3.8" fill="#fff8c0" opacity="0.5"/>
        <ellipse cx="-7.2" cy="-6.0" rx="3.4" ry="1.35" fill="#ffffff" opacity="0.4"/>
        <g fill="#F2B705" opacity="0.32">
          <circle cx="-7" cy="-1.5" r="0.42"/>
          <circle cx="-3" cy="4.0" r="0.38"/>
          <circle cx="3.5" cy="-3.2" r="0.34"/>
          <circle cx="9" cy="1.8" r="0.4"/>
          <circle cx="0.5" cy="6.0" r="0.3"/>
          <circle cx="-11" cy="2.2" r="0.36"/>
        </g>
        <path d="M-20.6 -5.8 C-21.5 -8.2 -19.8 -9.6 -18.0 -8.6 C-16.7 -7.8 -17.0 -6.0 -18.5 -5.4Z" fill="#8B6914"/>
      </g>
    </g>
  </g>
  <circle id="lens-ring" cx="26.5" cy="26.0" r="17.6" fill="none" stroke="#f5f7f8" stroke-width="2.7"/>
  <circle cx="26.5" cy="26.0" r="16.12" fill="none" stroke="#000000" stroke-width="0.55" opacity="0.2"/>
  <circle cx="26.5" cy="26.0" r="18.55" fill="none" stroke="#ffffff" stroke-width="0.45" opacity="0.12"/>
  <g id="leaf" transform="translate(9.66 24.10) rotate(-55) scale(0.82)">
    <path d="M0 0.2 C-0.8 -2.8 1.8 -7.2 5.2 -8.8 C4.4 -5.0 2.6 -1.8 0 0.2Z" fill="#3BB273"/>
    <path d="M0.5 -0.2 C1.6 -3.0 3.0 -5.8 4.6 -7.6" fill="none" stroke="#2a8f58" stroke-width="0.5" stroke-linecap="round" opacity="0.75"/>
  </g>
  <path id="glint" d="M16.7 17.2 A11.9 11.9 0 0 1 30.5 14.0" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <g id="handle-group">
    <path id="handle" d="M38.95 38.45 L49.91 49.41"
          stroke="url(#handleGrad)" stroke-width="4.4" stroke-linecap="round" fill="none"/>
    <path id="ferrule" d="M38.95 38.45 L41.35 40.85"
          stroke="#c81010" stroke-width="5.550000000000001" stroke-linecap="round" fill="none"/>
    <path d="M42.13 41.63 L48.14 47.64"
          stroke="#ffffff" stroke-width="1.0" stroke-linecap="round" opacity="0.22"/>
  </g>
</svg>
